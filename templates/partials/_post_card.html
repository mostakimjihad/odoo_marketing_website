<a href="{% url 'blog:detail' post.slug %}" class="group surface hover-lift overflow-hidden block h-full">
    <div class="relative aspect-video overflow-hidden border-b border-line">
        {% if post.cover_image %}
            <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-full object-cover">
        {% else %}
            <div class="w-full h-full bg-surface flex items-center justify-center">
                <span class="font-display text-6xl font-semibold grad-text-static">{{ post.title|slice:":1" }}</span>
            </div>
        {% endif %}
    </div>
    <div class="p-5">
        {% if post.published_at %}
        <p class="font-mono text-[11px] text-ink3 mb-2">{{ post.published_at|date:"M j, Y" }}</p>
        {% endif %}
        <h3 class="font-display text-base font-semibold text-ink mb-1.5 group-hover:text-cyan-400 transition tracking-tight">{{ post.title }}</h3>
        {% if post.excerpt %}
        <p class="text-sm text-ink2 line-clamp-2">{{ post.excerpt }}</p>
        {% endif %}
    </div>
</a>
