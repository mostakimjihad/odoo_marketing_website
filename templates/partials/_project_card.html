<a href="{% url 'portfolio:project_detail' project.slug %}" class="group surface hover-lift overflow-hidden block">
    <div class="relative aspect-video overflow-hidden border-b border-line">
        {% if project.cover_image %}
            <img src="{{ project.cover_image.url }}" alt="{{ project.title }}" class="w-full h-full object-cover">
        {% else %}
            <div class="w-full h-full bg-surface flex items-center justify-center">
                <span class="font-semibold text-6xl text-ink4">{{ project.title|slice:":1" }}</span>
            </div>
        {% endif %}
    </div>

    <div class="p-5">
        <h3 class="font-semibold text-base text-ink mb-1.5 group-hover:text-indigo-300 transition tracking-tight">{{ project.title }}</h3>
        <p class="text-sm text-ink2 line-clamp-2 leading-relaxed">{{ project.description|truncatechars:120 }}</p>

        <div class="mt-4 inline-flex items-center text-[12px] font-medium text-indigo-300 uppercase tracking-wider">
            <span>View project</span>
            <svg class="w-3.5 h-3.5 ml-1 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </div>
    </div>
</a>
