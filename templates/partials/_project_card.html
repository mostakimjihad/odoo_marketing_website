<a href="{% url 'portfolio:project_detail' project.slug %}" class="group surface hover-lift overflow-hidden block">
    <div class="relative aspect-video overflow-hidden border-b border-line">
        {% if project.cover_image %}
            <img src="{{ project.cover_image.url }}" alt="{{ project.title }}" class="w-full h-full object-cover" loading="lazy">
        {% else %}
            {% with idx=forloop.counter|stringformat:"s" %}
            <img src="https://images.unsplash.com/photo-{% cycle '1518770660439-4636190af475' '1460925895917-afdab827c52f' '1454165804606-c3d57bc86b40' '1551288049-bebda4e38f71' '1531297484001-80022131f5a1' '1518186285589-2f7649de83e0' %}?w=600&h=340&q=80&auto=format&fit=crop" alt="{{ project.title }}" class="w-full h-full object-cover" loading="lazy">
            {% endwith %}
        {% endif %}
    </div>

    <div class="p-5">
        <h3 class="font-semibold text-base text-ink mb-1.5 group-hover:text-indigo-600 transition tracking-tight">{{ project.title }}</h3>
        <p class="text-sm text-ink2 line-clamp-2 leading-relaxed">{{ project.description|truncatechars:120 }}</p>

        <div class="mt-4 inline-flex items-center text-[12px] font-medium text-indigo-600 uppercase tracking-wider">
            <span>View project</span>
            <svg class="w-3.5 h-3.5 ml-1 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </div>
    </div>
</a>
