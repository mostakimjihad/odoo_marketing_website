<a href="{% url 'portfolio:case_study_detail' case_study.slug %}" class="group surface hover-lift overflow-hidden block">
    <div class="relative aspect-video overflow-hidden border-b border-line">
        {% if case_study.cover_image %}
            <img src="{{ case_study.cover_image.url }}" alt="{{ case_study.title }}" class="w-full h-full object-cover" loading="lazy">
        {% else %}
            <img src="https://images.unsplash.com/photo-{% cycle '1454165804606-c3d57bc86b40' '1556761175-5973dc0f32e7' '1586528116311-ad8dd3c8310d' '1606857521015-7f9fcf423740' '1563013544-824ae1b704d3' '1460925895917-afdab827c52f' %}?w=600&h=340&q=80&auto=format&fit=crop" alt="{{ case_study.title }}" class="w-full h-full object-cover" loading="lazy">
        {% endif %}
        {% if case_study.industry %}
        <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-medium uppercase tracking-wider bg-white/95 text-ink2 border border-line">{{ case_study.industry }}</span>
        {% endif %}
    </div>

    <div class="p-5">
        <h3 class="font-semibold text-base text-ink mb-1.5 group-hover:text-indigo-600 transition tracking-tight">{{ case_study.title }}</h3>
        <p class="text-sm text-ink2 line-clamp-2 leading-relaxed">{{ case_study.problem|truncatechars:120 }}</p>

        <div class="mt-4 inline-flex items-center text-[12px] font-medium text-indigo-600 uppercase tracking-wider">
            <span>Read case study</span>
            <svg class="w-3.5 h-3.5 ml-1 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </div>
    </div>
</a>
